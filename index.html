<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LUCID v17">
<meta name="theme-color" content="#15151E">
<title>LUCID</title>
<style>
:root{--bg:#15151E;--bg2:#1E1E2A;--text:#ECE8E0;--gold:#D4B056;--gold-bright:#E6C270;--dim:rgba(236,232,224,0.42);--faint:rgba(236,232,224,0.14);--red:#B85050;--green:#7AB87A}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
::selection{background:rgba(212,176,86,0.3)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:rgba(212,176,86,0.2);border-radius:2px}
textarea,button,input{font-family:Georgia,serif}
textarea::placeholder{color:rgba(236,232,224,0.28)}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 80% 50% at 15% 15%,rgba(212,176,86,0.06) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 85% 85%,rgba(107,159,212,0.05) 0%,transparent 60%)}
.pg{position:relative;z-index:1}

/* ── HOME ── */
.home{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center}
.ring{width:64px;height:64px;border-radius:50%;border:1px solid rgba(212,176,86,0.45);display:flex;align-items:center;justify-content:center;margin-bottom:36px;font-size:26px;background:rgba(212,176,86,0.08);color:var(--gold-bright)}
h1{font-size:clamp(2.6rem,7vw,4rem);font-weight:400;letter-spacing:.2em;margin-bottom:10px;line-height:1}
.sub{font-size:.7rem;letter-spacing:.35em;text-transform:uppercase;color:rgba(212,176,86,0.75);margin-bottom:48px}
.tagline{max-width:420px;line-height:1.95;color:rgba(236,232,224,0.68);font-size:.9rem;margin-bottom:48px;font-style:italic}
.btn{background:rgba(236,232,224,0.04);border:1px solid rgba(236,232,224,0.28);color:rgba(236,232,224,0.78);cursor:pointer;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;border-radius:3px;padding:13px 40px;transition:all .2s}
.btn:hover{border-color:rgba(236,232,224,0.5);color:rgba(236,232,224,0.95);background:rgba(236,232,224,0.07)}
.bg{border-color:rgba(212,176,86,0.7)!important;color:var(--gold-bright)!important;background:rgba(212,176,86,0.10)!important}.bg:hover{background:rgba(212,176,86,0.18)!important;color:#F0D080!important;border-color:rgba(212,176,86,0.9)!important}
.btn:disabled{cursor:not-allowed;opacity:.35}
.modes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.mb{padding:22px 32px;min-width:210px;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(236,232,224,0.03);border:1px solid rgba(236,232,224,0.22);color:rgba(236,232,224,0.72);cursor:pointer;border-radius:4px;transition:all .25s;font-family:Georgia,serif}
.mb:hover{border-color:rgba(212,176,86,0.6);color:var(--gold-bright);background:rgba(212,176,86,0.08)}
.mb:disabled{cursor:not-allowed;opacity:.35}
.mb .mi{font-size:1.3rem;margin-bottom:2px}.mb .mn{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase}.mb .md{font-size:.58rem;letter-spacing:.06em;opacity:.65}
.mem-badge{font-size:.62rem;color:rgba(122,158,126,0.75);letter-spacing:.1em;margin-top:8px}
.mem-badge a{color:rgba(122,158,126,0.75);cursor:pointer}

/* ── WELCOME ── */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center}
.welcome-opts{display:flex;flex-direction:column;gap:16px;width:100%;max-width:340px;margin-top:40px}
.welcome-opt{padding:22px 24px;border:1px solid rgba(236,232,224,0.2);border-radius:5px;cursor:pointer;text-align:left;background:rgba(236,232,224,0.03);transition:all .25s}
.welcome-opt:hover{border-color:rgba(212,176,86,0.5);background:rgba(212,176,86,0.06)}
.welcome-opt-title{font-size:.78rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold-bright);margin-bottom:6px}
.welcome-opt-desc{font-size:.76rem;color:rgba(236,232,224,0.55);line-height:1.6}
.welcome-key{width:100%;max-width:340px;margin-top:32px}

/* ── SESSION ── */
.se{max-width:720px;margin:0 auto;padding:40px 24px 120px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:36px}
.ls{font-size:.65rem;letter-spacing:.32em;text-transform:uppercase;color:rgba(212,176,86,0.7);margin-bottom:5px}
.ld{font-size:.72rem;color:rgba(236,232,224,0.55);letter-spacing:.12em}
.bb{background:none;border:none;color:rgba(236,232,224,0.55);cursor:pointer;font-size:.72rem;letter-spacing:.1em;padding:6px 10px;border-radius:3px;transition:all .2s}
.bb:hover{color:rgba(236,232,224,0.85);background:rgba(236,232,224,0.05)}
.pt{font-size:1.05rem;color:rgba(236,232,224,0.6);margin-bottom:38px;font-style:italic;line-height:1.85}
.rb{width:100%;min-height:200px;background:rgba(236,232,224,0.03);border:none;border-top:1px solid var(--faint);border-bottom:1px solid var(--faint);color:var(--text);font-size:1.02rem;line-height:1.95;padding:26px 4px;resize:none;outline:none;caret-color:var(--gold)}
.eb{padding:16px 20px;background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.45);border-radius:4px;margin-bottom:32px;font-size:.88rem;color:#F4A0A0;line-height:1.5}

/* ── CONVERSATION ── */
.conv{display:flex;flex-direction:column;gap:24px;margin-bottom:32px}
.msg-u{align-self:flex-end;max-width:86%}
.msg-u-label{font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(236,232,224,0.35);margin-bottom:6px;text-align:right}
.msg-u-text{background:rgba(236,232,224,0.07);border:1px solid rgba(236,232,224,0.16);border-radius:12px 12px 3px 12px;padding:16px 20px;font-size:.94rem;line-height:1.88;color:rgba(236,232,224,0.88);white-space:pre-wrap;text-align:left}
.msg-l{align-self:flex-start;max-width:94%;width:100%;animation:fi .5s ease both}
.msg-l-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.msg-l-name{font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(212,176,86,0.7)}
.mode-badge{font-size:.52rem;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:10px;border:1px solid rgba(212,176,86,0.25);color:rgba(212,176,86,0.5)}
.msg-reading{background:rgba(212,176,86,0.04);border:1px solid rgba(212,176,86,0.15);border-radius:3px 8px 8px 8px;padding:10px 16px;font-size:.78rem;line-height:1.7;color:rgba(236,232,224,0.5);font-style:italic;margin-bottom:8px;white-space:pre-wrap}
.msg-body{background:rgba(212,176,86,0.06);border:1px solid rgba(212,176,86,0.22);border-radius:3px 12px 12px 12px;padding:22px 24px;font-size:.95rem;line-height:1.95;color:rgba(236,232,224,0.93);white-space:pre-wrap}
.msg-closure{margin-top:8px;padding:12px 18px;border-left:2px solid rgba(212,176,86,0.5);background:rgba(212,176,86,0.05);border-radius:0 4px 4px 0;font-size:.88rem;color:rgba(236,232,224,0.7);line-height:1.75;font-style:italic}
.msg-closure::before{content:'↳ ';color:rgba(212,176,86,0.7);font-style:normal}
.msg-loading{align-self:flex-start;padding:16px 24px;background:rgba(212,176,86,0.05);border:1px solid rgba(212,176,86,0.18);border-radius:3px 12px 12px 12px}
.pro-topic{margin-bottom:24px;padding:12px 18px;border:1px solid rgba(212,176,86,0.3);border-radius:4px;background:rgba(212,176,86,0.06);font-size:.78rem;color:rgba(212,176,86,0.8);letter-spacing:.08em;font-style:italic}
.ci-wrap{margin-top:8px;padding-top:24px;border-top:1px solid rgba(212,176,86,0.15)}
.ci{width:100%;min-height:80px;background:rgba(236,232,224,0.03);border:none;border-top:1px solid rgba(212,176,86,0.2);color:var(--text);font-size:.92rem;line-height:1.8;padding:14px 0;resize:none;outline:none;caret-color:var(--gold)}
.ds{display:flex;gap:8px;align-items:center;padding:4px 0}
.dt{width:5px;height:5px;border-radius:50%;animation:pu 1.5s ease-in-out infinite;opacity:.85}
@keyframes pu{0%,80%,100%{transform:scale(.7);opacity:.35}40%{transform:scale(1.3);opacity:1}}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.saving{font-size:.66rem;color:rgba(212,176,86,0.6);text-align:center;margin-top:20px;font-style:italic}
.tm{text-align:center;padding:60px 20px}
.tl{font-size:.74rem;color:rgba(212,176,86,0.65);letter-spacing:.2em;text-transform:uppercase;margin-bottom:20px}

/* ── HISTORY ── */
.hi{padding:22px 0;border-bottom:1px solid rgba(236,232,224,0.1);cursor:pointer;transition:background .2s}.hi:hover{background:rgba(236,232,224,0.04)}
.hd{font-size:.66rem;color:rgba(236,232,224,0.5);letter-spacing:.1em}
.hp{color:rgba(236,232,224,0.75);font-size:.92rem;line-height:1.7;margin-top:6px}
.ht{font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:10px;border:1px solid rgba(212,176,86,0.35);color:rgba(212,176,86,0.7)}
.db{background:none;border:none;color:rgba(236,232,224,0.3);cursor:pointer;font-size:.66rem;transition:color .2s;padding:4px 10px;border-radius:3px}.db:hover{color:rgba(192,57,43,0.85);background:rgba(192,57,43,0.05)}

/* ── MEMORY ── */
.mem-sec{margin-bottom:24px}
.mem-title{font-size:.64rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(212,176,86,0.7);margin-bottom:8px}
.mem-item{font-size:.84rem;color:rgba(236,232,224,0.78);line-height:1.7;padding:4px 0 4px 12px;border-left:2px solid rgba(236,232,224,0.12)}
.ratio-bar{height:6px;border-radius:3px;background:rgba(236,232,224,0.1);overflow:hidden;margin:8px 0}
.ratio-fill{height:100%;background:linear-gradient(90deg,rgba(212,176,86,0.6),rgba(107,159,212,0.6));border-radius:3px;transition:width .5s}
.closure-item{padding:12px 16px;border:1px solid rgba(212,176,86,0.18);border-radius:4px;margin-bottom:10px;background:rgba(212,176,86,0.04)}
.closure-item-text{font-size:.84rem;color:rgba(236,232,224,0.8);line-height:1.65;font-style:italic}
.closure-item-meta{font-size:.58rem;color:rgba(236,232,224,0.38);margin-top:6px;letter-spacing:.08em}

/* ── INPUTS ── */
.ki{width:100%;background:rgba(236,232,224,0.06);border:1px solid rgba(236,232,224,0.22);color:var(--text);padding:13px 14px;font-size:.8rem;border-radius:3px;outline:none;font-family:'SF Mono','Menlo','Courier New',monospace;letter-spacing:0.02em;transition:all .2s}
.ki:focus{border-color:rgba(212,176,86,0.7);background:rgba(236,232,224,0.09)}
.ki::placeholder{color:rgba(236,232,224,0.3);font-family:'SF Mono','Menlo','Courier New',monospace}
.cb{margin-top:40px;padding:22px;border:1px solid rgba(236,232,224,0.18);border-radius:5px;background:rgba(236,232,224,0.03)}


/* ── NO-NEGOCIABLES ── */
.nn-act:hover{color:rgba(212,176,86,0.75)}

/* ── PERSPECTIVA DIRECTA [P] ── */
.msg-perspective{margin-top:10px;padding:14px 18px;background:rgba(236,232,224,0.04);border:1px solid rgba(236,232,224,0.14);border-radius:4px;font-size:.9rem;color:rgba(236,232,224,0.78);line-height:1.85}
.msg-perspective-label{font-size:.52rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(236,232,224,0.32);margin-bottom:7px}


/* ── FORM INPUTS (No-Negociables) ── */
.sim-inp{width:100%;background:rgba(236,232,224,0.06);border:1px solid rgba(236,232,224,0.22);color:var(--text);padding:13px 14px;font-size:.8rem;border-radius:3px;outline:none;font-family:Georgia,serif;transition:border-color .2s,background .2s}
.sim-inp:focus{border-color:rgba(212,176,86,0.7);background:rgba(236,232,224,0.09)}
.sim-ta{width:100%;min-height:90px;background:rgba(236,232,224,0.06);border:1px solid rgba(236,232,224,0.22);color:var(--text);padding:13px 14px;font-size:.8rem;border-radius:3px;outline:none;font-family:Georgia,serif;resize:none;line-height:1.7;transition:border-color .2s,background .2s}
.sim-ta:focus{border-color:rgba(212,176,86,0.7);background:rgba(236,232,224,0.09)}
/* ── DESPACHO / PROYECTAR ── */
.msg-despacho{background:rgba(107,159,212,0.07);border:1px solid rgba(107,159,212,0.24);border-radius:3px 12px 12px 12px;padding:22px 24px;font-size:.95rem;line-height:1.95;color:rgba(236,232,224,0.93);white-space:pre-wrap}
.msg-proyectar{background:rgba(122,184,122,0.07);border:1px solid rgba(122,184,122,0.24);border-radius:3px 12px 12px 12px;padding:22px 24px;font-size:.95rem;line-height:1.95;color:rgba(236,232,224,0.93);white-space:pre-wrap}

/* ── INFORME COGNITIVO ── */
.report-block{margin-top:28px;padding:22px 24px;border:1px solid rgba(212,176,86,0.2);border-radius:5px;background:rgba(212,176,86,0.03)}
.report-text{font-size:.88rem;color:rgba(236,232,224,0.82);line-height:1.88;white-space:pre-wrap}

/* ── UTILS ── */
.fl{display:flex}.fw{flex-wrap:wrap}.jc{justify-content:center}.jb{justify-content:space-between}.ac{align-items:center}
.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g20{gap:20px}
.mt10{margin-top:10px}.mt12{margin-top:12px}.mt14{margin-top:14px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt28{margin-top:28px}.mt30{margin-top:30px}.mt32{margin-top:32px}.mt40{margin-top:40px}.mt48{margin-top:48px}
.mb8{margin-bottom:8px}.mb10{margin-bottom:10px}.mb14{margin-bottom:14px}.mb16{margin-bottom:16px}.mb18{margin-bottom:18px}
.tc{text-align:center}.fw-w{flex-wrap:wrap}
/* field label */
.flbl{font-size:.64rem;color:rgba(236,232,224,0.6);letter-spacing:.15em;text-transform:uppercase;margin-bottom:10px}
/* field hint */
.fhnt{font-size:.6rem;color:rgba(236,232,224,0.32);margin-top:8px}
/* section panel */
.spnl{padding:22px;border-radius:5px}
.spnl-b{border:1px solid rgba(107,159,212,0.3);background:rgba(107,159,212,0.04)}
.spnl-b2{border:1px solid rgba(107,159,212,0.25);background:rgba(107,159,212,0.04)}
.spnl-g{border:1px solid rgba(212,176,86,0.25);background:rgba(212,176,86,0.04)}
/* section titles */
.stb{font-size:.64rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(107,159,212,0.75);margin-bottom:10px}
.stb12{font-size:.64rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(107,159,212,0.75);margin-bottom:12px}
/* sync status */
.st-ok{font-size:.72rem;color:rgba(122,158,126,0.75);margin-bottom:16px}
.st-err{font-size:.72rem;color:rgba(192,57,43,0.75);margin-bottom:16px}
.st-sync{font-size:.72rem;color:rgba(107,159,212,0.55);margin-bottom:16px}
/* button sizes/colors */
.btn-sm{padding:10px 22px;font-size:.66rem}
.btn-b{border-color:rgba(107,159,212,0.5);color:rgba(107,159,212,0.85)}
.btn-r{color:rgba(192,57,43,0.6);border-color:rgba(192,57,43,0.3)}
.btn-del{padding:7px 14px;font-size:.58rem;color:rgba(192,57,43,0.65);border-color:rgba(192,57,43,0.3)}
/* key status */
.kv-ok{margin-top:10px;font-size:.62rem;color:rgba(122,158,126,0.8)}
.kv-hint{margin-top:10px;font-size:.62rem;color:rgba(236,232,224,0.45)}
.kv-del{margin-top:10px}
/* misc */
.mono{font-family:monospace;color:rgba(107,159,212,0.85)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap}
.qa{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.kbd-hint{font-size:.66rem;color:rgba(236,232,224,0.28)}
.input-row{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.reply-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.ftag{margin-top:32px;font-size:.64rem;color:rgba(236,232,224,0.28);letter-spacing:.12em}
.report-hdr{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(212,176,86,0.75);margin-bottom:18px}
.rep-gen{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(212,176,86,0.65);margin-bottom:14px}
.it{font-style:italic}
.mem-count{font-size:.74rem;color:rgba(122,158,126,0.75);margin-bottom:32px}
.em-state{font-size:.84rem;color:rgba(236,232,224,0.78);font-style:italic}
.hz-lbl{opacity:.55;font-size:.66rem}
.src-lbl{opacity:.42;font-size:.62rem;font-style:italic}
.ang-lbl{opacity:.38;font-size:.60rem;font-style:italic}

/* ── ARRIVE ── */
.arrive{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;text-align:center}
.arrive-q{font-size:1rem;color:rgba(236,232,224,0.75);font-style:italic;margin-bottom:36px;line-height:1.8}
.arrive-opts{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px}
.arrive-opt{padding:18px 22px;border:1px solid rgba(236,232,224,0.18);border-radius:5px;cursor:pointer;text-align:left;background:rgba(236,232,224,0.03);transition:all .22s;display:flex;align-items:center;gap:14px}
.arrive-opt:hover{border-color:rgba(212,176,86,0.5);background:rgba(212,176,86,0.06)}
.arrive-opt-icon{font-size:1.1rem;width:24px;text-align:center;flex-shrink:0}
.arrive-opt-label{font-size:.8rem;color:rgba(236,232,224,0.78);letter-spacing:.04em}
/* ── LEARN SELECT ── */
.learn-area{padding:22px 24px;border:1px solid rgba(107,159,212,0.28);border-radius:5px;cursor:pointer;background:rgba(107,159,212,0.04);transition:all .22s;margin-bottom:14px}
.learn-area:hover{border-color:rgba(107,159,212,0.6);background:rgba(107,159,212,0.10)}
.learn-area-icon{font-size:1.2rem;margin-bottom:8px}
.learn-area-title{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(107,159,212,0.9);margin-bottom:6px}
.learn-area-desc{font-size:.75rem;color:rgba(236,232,224,0.55);line-height:1.55}
/* ── LEARN TOPIC ── */
.learn-topic-item{padding:14px 18px;border:1px solid rgba(236,232,224,0.15);border-radius:4px;cursor:pointer;background:rgba(236,232,224,0.02);transition:all .2s;margin-bottom:10px;font-size:.82rem;color:rgba(236,232,224,0.75);line-height:1.5}
.learn-topic-item:hover{border-color:rgba(107,159,212,0.45);background:rgba(107,159,212,0.06);color:rgba(236,232,224,0.92)}
/* ── LEARN SESSION ── */
.msg-learn{background:rgba(107,159,212,0.08);border:1px solid rgba(107,159,212,0.25);border-radius:3px 12px 12px 12px;padding:22px 24px;font-size:.95rem;line-height:1.95;color:rgba(236,232,224,0.93);white-space:pre-wrap}
/* ── ACCOUNTABILITY ── */
.acc-block{background:rgba(212,176,86,0.06);border:1px solid rgba(212,176,86,0.28);border-radius:5px;padding:18px 20px;margin-bottom:24px;text-align:left}
.acc-label{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(212,176,86,0.6);margin-bottom:8px}
.acc-text{font-size:.86rem;color:rgba(236,232,224,0.82);line-height:1.7;font-style:italic;margin-bottom:14px}
.acc-btns{display:flex;gap:10px}
/* ── TRAJECTORY ── */
.traj-item{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid rgba(236,232,224,0.06)}
.traj-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}

// ── PERFIL BASE ──────────────────────────────────────────────
const BASE=`FERNANDO PINEDA — perfil cognitivo completo (mayo 2026):

IDENTIDAD: ~40 años, español, Madrid (Colmenar Viejo). Casado, dos hijos. Delivery Manager en Tetra Pak (Upgrades/Servicios). Opera al ~60% de su potencial — no por falta de capacidad, sino porque el sistema en que opera no está diseñado para alimentarle. Señal más limpia de quién es: se levanta a las 6am sin que nadie se lo pida ni espere reconocimiento. Acto puro, sin audiencia.

EL ESCUDO — patrón más importante:
Construido a los 6 años en una casa emocionalmente fracturada (padres juntos por obligación, conflicto crónico, Fernando como mensajero). Aprendió a ser útil antes de tener hambre.
Mecanismos: (1) Minimiza su propio mérito antes de que otros lo cuestionen. (2) Construye pedestales en personas de mayor conocimiento percibido para reducir exposición.
Gradiente: con mujer → desactivación consciente activa. Con hijos → no existe. Con Nacho y círculo cercano → activo por inercia. Con su padre → máxima activación.
Manifestaciones: cuando le felicitan, el primer movimiento es revertirlo al equipo. El humor y la simpatía son su escudo de lujo: conecta sin requerir vulnerabilidad real.
Coste más alto: no la exposición que evita, sino la conexión que impide.
Distinción crítica: priorizar a otros puede nacer de amor elegido (mujer e hijos → da energía) o de supervivencia aprendida (resto → consume energía).

ARQUITECTURA DE DECISIÓN:
Razón para filtrar, cuerpo para cerrar. En decisiones importantes, el sistema emocional tiene veto. Las mejores decisiones tienen algo de "los suyos" dentro.

EL PROFESIONAL:
Nivel diferencial: resuelve problemas no recurrentes que el resto no puede. Techo intelectual de su entorno, aunque el rol no lo nombre así.
Transición activa: de "comprensivo sin límites" a "comprensivo con consecuencias."
Le activa: aprender, planificar desde cero, llevar proyectos a consecución. Es finisher — necesita el cierre.
Le drena: naturaleza cíclica del negocio sin final visible.
Activo invisible: leer personas en profundidad. Construido a los 6 años. No aparece en ningún KPI.
Diagnóstico central: "Sabe más de lo que cree. El problema no es de conocimiento — es de articulación y de permiso para ocupar ese espacio."
Trayectoria: 24.000€ en 2015 → más de 100.000€ actuales. La curva corporativa se aplana.

VECTOR CENTRAL AHORA — operar desde aquí:
Fernando y Nacho construyen una consultoría de IA para pymes. Punto de apoyo: conocimiento en gestión de sistemas y personas. Palanca: IA como multiplicador técnico. Mercado: pymes con dolor real. La ventana temporal está abierta ahora. Lo que falta: pasar de articulación a estructura ejecutable.

LOS SUYOS:
Mujer: persona más cercana, única con quien ha llegado a intimidad honesta plena.
Hijos: con ellos el escudo no existe.
Padre: mayor influencia en su vida. "Su vela." Con radioterapia actualmente (mayo 2026). Máxima activación del escudo. Ha trabajado el duelo anticipado — estoicismo real.
Nacho: amigo real y socio del proyecto IA. Escudo activo por inercia, reduciéndose.

EL FERNANDO DE 50 — norte de referencia para recomendaciones:
Vive cerca del mar (Cádiz como referencia afectiva). Cuerpo cuidado. Negocio individual consolidado que genera soberanía financiera real. Perfil antifrágil: si Tetra Pak desapareciera, no se cae. Legado: modelo generacional — cada generación deja a la siguiente un escalón más arriba.
Si no ocurre en los próximos 10 años, se sentirá traicionado a sí mismo. El momento es ahora.

MIEDOS REALES:
Relacionales: que algo les ocurra a sus hijos, mujer, padres.
Estructural: perder el trabajo. Solo se disuelve cuando construye la alternativa.

CÓMO TRABAJAR CON ÉL:
- Directo, sin relleno. Cero adulación.
- No minimices su conocimiento — trátalo como el profesional de alto nivel que es.
- Cuando el escudo aparezca (minimizar un logro, pedestal innecesario, pedir validación que no necesita), nómbralo como espejo.

- El proyecto con Nacho es el vector central. Cualquier trabajo en IA, consultoría, estructura de negocio conecta directamente con esto.\`;

const MEM_SYS=`Eres la memoria longitudinal de LUCID. Actualiza el perfil cognitivo de Fernando.

// ── MEMORY ───────────────────────────────────────────────────
const EMPTY_MEM={sessionCount:0,patterns:[],activeBiases:[],valueConflicts:[],avoidedDecisions:[],activeResistances:[],recurringThemes:[],emotionalState:'',growth:[],blindSpots:[],keyInsights:[],recycledInsights:[],commitments:[],virtudes:[],lastTopics:[],escudoActivations:[],nachoProgress:'',generativeClosures:[],lastClosure:null,closureFollowedUp:false,comfortCount:0,challengeCount:0,lastMode:null,sessionModes:[],lastCheckinDate:null,consecutiveNo:0,accountabilityLog:[],learningTopics:[],conceptsApplied:[],knowledgeGaps:[],emotionalHistory:[]};

function loadMem(){try{var m=JSON.parse(localStorage.getItem('lucid-mem')||'null');if(!m)return{...EMPTY_MEM};if(!m.virtudes)m.virtudes=[];if(m.consecutiveNo===undefined)m.consecutiveNo=0;if(!m.accountabilityLog)m.accountabilityLog=[];if(!m.escudoActivations)m.escudoActivations=[];if(m.nachoProgress===undefined)m.nachoProgress='';if(!m.learningTopics)m.learningTopics=[];if(!m.conceptsApplied)m.conceptsApplied=[];if(!m.knowledgeGaps)m.knowledgeGaps=[];if(!m.emotionalHistory)m.emotionalHistory=[];if(m.closureFollowedUp===undefined)m.closureFollowedUp=false;return Object.assign({},EMPTY_MEM,m);}catch{return{...EMPTY_MEM}}}

// ── MEMORY CONTEXT ───────────────────────────────────────────

// ── API ──────────────────────────────────────────────────────
async function api(sys,msgs,model){
  var k=gk();if(!k)throw new Error('Configura tu API key primero.');
  var m=model||MODEL_FAST;
  var r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:m,max_tokens:m===MODEL_DEEP?2600:700,system:sys,messages:msgs})
  });
  var d=await r.json();
  if(d.error)throw new Error(d.error.message);
  return d.content[0].text;}

// ── PARSE LUCID RESPONSE ─────────────────────────────────────
function parseLucid(raw){
  // Expected: [L] reading\n---\nbody\n---\n[P] perspective\n---\n↳ closure
  var reading='',body='',closure='',perspective='';
  try{
    var lm=raw.match(/\[L\]([\s\S]*?)---/);
    var pm=raw.match(/\[P\]([\s\S]*?)(?=\n---\n|\n↳|$)/);
    var cm=raw.match(/↳\s*([\s\S]+)$/m);
    var parts=raw.split(/\n---\n/);
    if(lm)reading=lm[1].trim();
    if(pm)perspective=pm[1].trim();
    if(cm)closure=cm[1].trim();
    if(parts.length>=2){
      var start=lm?1:0;
      var end=cm?parts.length-1:parts.length;
      body=parts.slice(start,end).join('\n')
        .replace(/↳[\s\S]*$/,'')
        .replace(/\[L\][\s\S]*?(?=\n\n|$)/,'')
        .replace(/\[P\][\s\S]*$/,'')
        .trim();
    }
    if(!reading&&!body&&!closure&&!perspective)body=raw.trim();
  }catch(e){body=raw.trim();}
  return{reading,body,closure,perspective};}

      keyInsights:nm.keyInsights||mem.keyInsights,
      recycledInsights:nm.recycledInsights||mem.recycledInsights||[],

function exportBackup(){
  var data={version:'lucid-17.0',exportedAt:new Date().toISOString(),memory:loadMem(),sessions:lss()};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='lucid-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},500);}

function triggerImport(onSuccess){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='.json';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var data=JSON.parse(ev.target.result);
        if(!data.version||!data.version.startsWith('lucid-'))throw new Error('Formato no reconocido. ¿Es un backup de LUCID?');
        var mem=data.memory||{};
        // v7→v8 migration: merge with EMPTY_MEM to add missing fields
        var migrated=Object.assign({},EMPTY_MEM,mem);
        // normalize v7-only fields
        if(!migrated.activeBiases)migrated.activeBiases=[];
        if(!migrated.valueConflicts)migrated.valueConflicts=[];
        if(!migrated.avoidedDecisions)migrated.avoidedDecisions=[];
        if(!migrated.activeResistances)migrated.activeResistances=[];
        if(!migrated.generativeClosures)migrated.generativeClosures=[];
        if(!migrated.sessionModes)migrated.sessionModes=[];
        if(data.sessions){
          // migrate v7 sessions (lucid-s7) to v8 (lucid-s17)
          sss(data.sessions);}
        saveMem(migrated);
        if(onSuccess)onSuccess(migrated);
        else{alert('Memoria importada correctamente. Recargando...');location.reload();}
      }catch(err){alert('Error al importar: '+err.message);}};
    reader.readAsText(f);};
  inp.click();}

function lss(){try{return JSON.parse(localStorage.getItem('lucid-s17')||'[]')}catch{return[]}}
function sss(s){localStorage.setItem('lucid-s17',JSON.stringify(s))}
function persist(){
  if(!S.sess.id)S.sess.id='s-'+Date.now();
  var ss=lss(),idx=ss.findIndex(function(x){return x.id===S.sess.id});
  var d={id:S.sess.id,ts:idx>=0?ss[idx].ts:Date.now(),type:S.sess.type,input:S.sess.input,conversation:S.sess.conversation,orch:S.sess.orch};
  if(idx>=0)ss[idx]=d;else ss.unshift(d);
  sss(ss.slice(0,50));S.sessions=lss();}
// ── GIST SYNC FUNCTIONS ──────────────────────────────────────
async function gistCreate(){
  var data={version:'lucid-17.0',syncedAt:new Date().toISOString(),memory:loadMem(),sessions:lss()};
  var r=await fetch('https://api.github.com/gists',{method:'POST',headers:ghHdrs(),body:JSON.stringify({description:'LUCID — Memoria cognitiva personal',public:false,files:{'lucid-data.json':{content:JSON.stringify(data)}}})});
  if(!r.ok){var e=await r.json();throw new Error(e.message||'Error HTTP '+r.status);}
  var d=await r.json();setGistId(d.id);setLastSync(data.syncedAt);return d.id;}

async function gistPush(){
  var token=getGhToken(),gistId=getGistId();if(!token||!gistId)return;
  var prevPage=S.page;
  SYNC.status='syncing';if(prevPage==='home'||prevPage==='memory')R();
  try{
    var data={version:'lucid-17.0',syncedAt:new Date().toISOString(),memory:loadMem(),sessions:lss()};
    var r=await fetch('https://api.github.com/gists/'+gistId,{method:'PATCH',headers:ghHdrs(),body:JSON.stringify({files:{'lucid-data.json':{content:JSON.stringify(data)}}})});
    if(!r.ok){var er=await r.json();throw new Error(er.message||'Error HTTP '+r.status);}
    setLastSync(data.syncedAt);SYNC.status='ok';SYNC.error=null;
  }catch(e){SYNC.status='error';SYNC.error=e.message;}
  if(S.page==='home'||S.page==='memory')R();}

async function gistPull(){
  var token=getGhToken(),gistId=getGistId();if(!token||!gistId)return null;
  try{
    var r=await fetch('https://api.github.com/gists/'+gistId,{headers:ghHdrs()});
    if(!r.ok)return null;
    var d=await r.json();
    var file=d.files&&d.files['lucid-data.json'];
    if(!file||!file.content)return null;
    var parsed=JSON.parse(file.content);
    var cloudTs=new Date(parsed.syncedAt||0).getTime();
    var localTs=new Date(getLastSync()||0).getTime();
    if(cloudTs>localTs){
      if(parsed.memory){saveMem(Object.assign({},EMPTY_MEM,parsed.memory));}
      if(parsed.sessions)sss(parsed.sessions);
      setLastSync(parsed.syncedAt);return'updated';}
    return'current';
  }catch(e){SYNC.error=e.message;return null;}}

async function doGistSetup(){
  var tokenEl=document.getElementById('gh-token'),gistEl=document.getElementById('gh-gist');
  if(!tokenEl)return;
  var token=tokenEl.value.trim(),gistId=gistEl?gistEl.value.trim():'';
  if(!token){alert('Introduce tu Personal Access Token de GitHub.');return;}
  setGhToken(token);SYNC.status='syncing';R();
  try{
    if(gistId){
      setGistId(gistId);
      var result=await gistPull();
      if(!result){alert('No se pudo conectar al Gist.\nVerifica el token y el Gist ID.');setGhToken('');setGistId('');SYNC.status='idle';R();return;}
      if(result==='updated'){S.sessions=lss();alert('¡Conectado! Memoria cargada desde la nube. Recargando...');location.reload();return;}
      alert('¡Conectado! Tu memoria local está sincronizada con el Gist.');
    }else{
      var newId=await gistCreate();
      alert('¡Gist creado!\n\nGist ID:\n'+newId+'\n\nGuárdalo — lo necesitarás para conectar desde iPhone o iPad.');
    }
    SYNC.status='ok';
  }catch(e){
    SYNC.status='error';SYNC.error=e.message;
    alert('Error: '+e.message+'\n\nVerifica que el token tiene permiso "gist" habilitado.');
    setGhToken('');setGistId('');
  }
  R();}

function doGistDisconnect(){
  if(!confirm('¿Desconectar el sync con GitHub?\nTu memoria local se mantiene intacta.'))return;
  setGhToken('');setGistId('');setLastSync('');SYNC={status:'idle',lastSync:null,error:null};R();}

function copyGistId(){
  var id=getGistId();if(!id)return;
  if(navigator.clipboard){navigator.clipboard.writeText(id).then(function(){alert('Gist ID copiado:\n'+id);}).catch(function(){alert('Gist ID:\n'+id);});}
  else alert('Gist ID:\n'+id);}

function fd(ts){var d=new Date(ts),n=new Date(),df=n-d;if(df<864e5)return'Hoy · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');if(df<1728e5)return'Ayer';return d.getDate()+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()]}
function tr(t,n){n=n||90;return t&&t.length>n?t.slice(0,n).trim()+'…':t||''}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function scrollB(){setTimeout(function(){window.scrollTo(0,document.body.scrollHeight)},60)}
function dots(c){return'<div class="ds">'+[0,1,2].map(function(i){return'<div class="dt" style="background:'+c+';animation-delay:'+i*0.25+'s"></div>'}).join('')+'</div>'}

async function doSub(){
  if(S.sess.input.length<20||S.sess.phase==='thinking')return;
  S.sess.error=null;S.sess.phase='thinking';
  S.sess.id='s-'+Date.now();S.sess.conversation=[];S.sess.apiHistory=[];R();
  try{
    S.sess.phase='active';
    S.sess.conversation.push({role:'user',text:S.sess.input});
    S.sess.apiHistory.push({role:'user',content:S.sess.input});
    S.sess.conversation.push({role:'loading'});R();scrollB();
    var mem=loadMem();
    var raw=await api(buildLucidSys(buildMemCtx(mem),1,S.arrivalState),S.sess.apiHistory,MODEL_DEEP);
    var parsed=parseLucid(raw);
    S.sess.apiHistory.push({role:'assistant',content:raw});
    S.sess.conversation=S.sess.conversation.filter(function(m){return m.role!=='loading'});
    S.sess.conversation.push(Object.assign({role:'lucid'},parsed));
    persist();R();scrollB();
    S.sess.saving=true;R();
    await updateMem(S.sess.input,raw,'mentor');
    S.sess.saving=false;persist();R();
  }catch(e){
    S.sess.error=e.message;S.sess.phase='active';
    S.sess.conversation=S.sess.conversation.filter(function(m){return m.role!=='loading'});R();}}

function buildReportSys(mem,sessCtx){
  var md=JSON.stringify({sessionCount:mem.sessionCount,patterns:mem.patterns,activeBiases:mem.activeBiases,valueConflicts:mem.valueConflicts,avoidedDecisions:mem.avoidedDecisions,activeResistances:mem.activeResistances,recurringThemes:mem.recurringThemes,growth:mem.growth,blindSpots:mem.blindSpots,keyInsights:mem.keyInsights,recycledInsights:mem.recycledInsights,commitments:mem.commitments,virtudes:mem.virtudes,emotionalState:mem.emotionalState,consecutiveNo:mem.consecutiveNo||0,lastMode:mem.lastMode,sessionModes:(mem.sessionModes||[]).slice(0,10)},null,0);
  return'Eres LUCID generando un informe cognitivo para Fernando. Espejo de largo plazo — directo, sin adulación, con la voz de LUCID.\n\nMEMORIA LONGITUDINAL:\n'+md+'\n\nHISTORIAL DE SESIONES:\n'+sessCtx+'\n\nPERFIL:\n'+BASE+'\n\nGenera el informe con estas secciones. Sin asteriscos ni markdown — texto limpio, secciones en MAYÚSCULAS:\n\nLO QUE SE MOVIÓ\nEvidencia concreta de cambio real. Conductas que cambiaron, decisiones tomadas, patrones que evolucionaron. Solo si hay evidencia — no suposiciones.\n\nLO QUE PERSISTE\nPatrones activos sin evidencia de movimiento. Decisiones que se siguen evitando. Nombra cuánto tiempo llevan sin moverse.\n\nLO QUE ESTÁ EMERGIENDO\nPatrones que el sistema detecta pero Fernando probablemente no ve desde dentro. Tendencias recientes, acumulaciones, cambios de tono.\n\nLA BRECHA PRINCIPAL\nUna sola cosa. La que si se trabajara tendría mayor impacto ahora. Basada en evidencia del historial — no juicios generales.\n\nFOCO PRÓXIMAS SEMANAS\n1-2 áreas concretas basadas en lo que la evidencia muestra que necesita — no lo que Fernando dice querer.\n\nExtensión: 400-500 palabras. Voz de LUCID: directa, sin adornos.';}

async function doGenReport(){
  if(S.generatingReport)return;
  S.generatingReport=true;S.report=null;R();
  try{
    var mem=loadMem();
    var sessions=lss().slice(0,20);
    var sc=sessions.map(function(s,i){
      var mode=s.orch&&s.orch.mode?MODE_LABEL[s.orch.mode]||s.orch.mode:'—';
      var topic=s.type==='lucid'&&s.orch&&s.orch.topic?s.orch.topic:(s.conversation&&s.conversation[0]&&s.conversation[0].text?s.conversation[0].text.slice(0,80):'—');
      var msgs=s.conversation?s.conversation.filter(function(m){return m.role==='lucid'}):[];
      var closure=msgs.length&&msgs[msgs.length-1].closure?msgs[msgs.length-1].closure.slice(0,100):'';
      return(i+1)+'. ['+fd(s.ts)+'] '+mode+' — '+topic+(closure?' → Cierre: '+closure:'');
    }).join('\n');
    var raw=await api(buildReportSys(mem,sc),[{role:'user',content:'Genera el informe ahora.'}],MODEL_DEEP);
    S.report=raw;
  }catch(e){S.report='Error al generar el informe: '+e.message;}
  S.generatingReport=false;R();}

  try{
    var mem=loadMem();
    var turnNum=S.learnSess.conversation.filter(function(m){return m.role==='learn'}).length+1;
    var raw=await api(buildLearnSys(buildMemCtx(mem),S.learnArea.title,S.learnTopic,S.arrivalState,turnNum),S.learnSess.apiHistory,MODEL_DEEP);
    var parsed=parseLucid(raw);
    S.learnSess.apiHistory.push({role:'assistant',content:raw});
    S.learnSess.conversation=S.learnSess.conversation.filter(function(m){return m.role!=='loading'});
    S.learnSess.conversation.push(Object.assign({role:'learn'},parsed));
    R();scrollB();
    if(S.learnSess.conversation.filter(function(m){return m.role==='user'}).length>=2){
      S.learnSess.saving=true;R();
      await updateLearnMem(S.learnSess.conversation,S.learnArea.title,S.learnTopic);
      S.learnSess.saving=false;R();}
  }catch(e){S.learnSess.error=e.message;S.learnSess.conversation=S.learnSess.conversation.filter(function(m){return m.role!=='loading'});R();}}

// ── START ────────────────────────────────────────────────────
initCheck();
</script>
